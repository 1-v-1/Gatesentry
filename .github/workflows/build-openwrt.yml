name: Build OpenWrt ipk packages

on:
  workflow_run:
    workflows: ["Build a release"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      target:
        description: "Target tag suffix (matches OpenWrt SDK image, e.g. x86_64, aarch64_cortex-a53, ramips-mt7621)"
        required: false
        default: "x86_64"

permissions:
  # contents: write is required so the workflow can attach the produced
  # ipks back to the release that the upstream "Build a release" workflow
  # created. With contents: read (the default for workflow_run triggers),
  # `gh release upload` returns HTTP 403.
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each entry pairs the OpenWrt SDK Docker image tag (verified to
          # exist on hub.docker.com/r/openwrt/sdk) with the BOARD identifier
          # the gatesentry Makefile maps to the release asset suffix.
          - sdk_tag: x86_64-23.05.6
            board: x86_64
          - sdk_tag: aarch64_cortex-a53-23.05.6
            board: aarch64_cortex-a53
          - sdk_tag: ramips-mt7621-23.05.6
            board: mipsel_24kc
          - sdk_tag: arm_cortex-a7_neon-vfpv4-23.05.6
            board: arm_cortex-a7

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Detect release version
        id: version
        run: |
          TAG=$(awk -F'"' '/var GATESENTRY_VERSION =/ { print $2 }' main.go)
          echo "tag=v${TAG}" >> "$GITHUB_OUTPUT"
          echo "Building ipks for tag v${TAG}"

      - name: Pull OpenWrt SDK container
        run: docker pull openwrt/sdk:${{ matrix.sdk_tag }}

      # Download the gatesentry release binary matching this matrix board on
      # the host. The Makefile reads /in/gatesentry-bin (see
      # package/gatesentry/Makefile) instead of fetching itself, which is
      # more reliable than depending on $(WGET) inside the SDK image.
      - name: Fetch gatesentry prebuilt binary
        env:
          TAG: ${{ steps.version.outputs.tag }}
          BOARD: ${{ matrix.board }}
        run: |
          mkdir -p .openwrt-cache
          case "$BOARD" in
            x86_64)                       ASSET=gatesentry-linux ;;
            aarch64_*)                    ASSET=gatesentry-linux-arm64 ;;
            arm_cortex-a7|arm_cortex-a9)  ASSET=gatesentry-linux-armv7 ;;
            mipsel_*)                     ASSET=gatesentry-linux-mipsel ;;
            *)                            ASSET=gatesentry-linux ;;
          esac
          curl -fsSL \
            -o .openwrt-cache/gatesentry-bin \
            "https://github.com/1-v-1/Gatesentry/releases/download/${TAG}/${ASSET}"
          chmod +x .openwrt-cache/gatesentry-bin

      # Compile the ipks. Notes:
      #  * The SDK image's root is /builder (not /sdk).
      #  * --user root so we can drop our package definitions into
      #    /builder/package/.
      #  * `make defconfig` seeds ./.config non-interactively (no TTY for
      #    menuconfig).
      #  * liblucihttp-lua is disabled — luci-app-gatesentry only needs the
      #    ucode binding (luci-base -> liblucihttp-ucode) and the Lua
      #    binding pulls in liblua which the SDK image does not provide.
      #  * IGNORE_ERRORS=y keeps the build going past the libucode/zlib/
      #    json-c host-tooling holes in this minimal SDK image. luci-app-
      #    gatesentry is a pure .lua metapackage (PKGARCH:=all) with no
      #    binaries, so a failed transitive compile does not affect its
      #    own install step.
      - name: Compile ipk packages
        run: |
          mkdir -p "${{ github.workspace }}/.openwrt-out"
          docker run --rm --user root \
            -v "${{ github.workspace }}/package":/src/package:ro \
            -v "${{ github.workspace }}/.openwrt-out":/out \
            -v "${{ github.workspace }}/.openwrt-cache":/in:ro \
            openwrt/sdk:${{ matrix.sdk_tag }} \
            bash -c '
              set -e
              set -x
              cp -r /src/package/* /builder/package/
              cd /builder

              echo "=== feeds update ==="
              ./scripts/feeds update -a
              echo "=== feeds install ==="
              ./scripts/feeds install -a -f

              make defconfig

              # Skip the Lua binding (defconfig defaults it to =m). The
              # Makefile uses $(if X,ON,OFF) which treats any non-empty
              # CONFIG_PACKAGE_liblucihttp-lua as ON, so we cannot simply
              # set it to =n. Sed the cmake option directly instead.
              sed -i "s/-DBUILD_LUA=\$(if/-DBUILD_LUA=OFF \$(if/" \
                feeds/luci/contrib/package/lucihttp/Makefile

              # Make luci-app-gatesentry itself selectable so its install
              # step runs (its Makefile does not auto-select it).
              echo "CONFIG_PACKAGE_luci-app-gatesentry=m" >> .config

              echo "=== compile gatesentry ==="
              make package/gatesentry/compile V=s 2>&1 | tail -40

              echo "=== compile luci-app-gatesentry ==="
              make package/luci-app-gatesentry/compile \
                IGNORE_ERRORS=y V=s 2>&1 | tail -40

              echo "=== produced ipks ==="
              # Only stage our own packages. bin/packages/ also contains
              # every transitive dependency ipk built by the SDK (cgi-io,
              # libubox, libuci, libubus, libiwinfo, libjson-c, lua,
              # libucode, liblucihttp, ...); uploading those to the release
              # bloats it with ~200 files we don't ship.
              find bin/packages \
                \( -name "gatesentry_*.ipk" \
                -o -name "luci-app-gatesentry_*.ipk" \) \
                -print -exec cp -v {} /out/ \;
              ls -la /out/
            '

      # Docker writes files as root (so we can write /builder/package/),
      # but the runner's user can't read root-owned files on the host.
      # Chmod the ipks so actions/upload-artifact can pick them up.
      - name: Fix artifact permissions
        run: sudo chmod -R a+rX "${{ github.workspace }}/.openwrt-out"

      - name: Upload ipks as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ipk-${{ matrix.board }}
          path: .openwrt-out/*.ipk
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true

      - name: Attach ipks to GitHub release
        if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if [ ! -d .openwrt-out ] || [ -z "$(ls -A .openwrt-out/*.ipk 2>/dev/null)" ]; then
            echo "::error::no ipks produced for ${{ matrix.board }}"
            exit 1
          fi
          gh release upload "$TAG" .openwrt-out/*.ipk \
            --repo "${{ github.repository }}" \
            --clobber