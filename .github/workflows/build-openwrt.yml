name: Build OpenWrt ipk packages

on:
  workflow_run:
    workflows: ["Build a release"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      target:
        description: "Target tag suffix (matches OpenWrt SDK image, e.g. x86_64, aarch64_cortex-a53, ramips-mt7621)"
        required: false
        default: "x86_64"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each entry pairs the OpenWrt SDK Docker image tag (verified to
          # exist on hub.docker.com/r/openwrt/sdk) with the BOARD identifier
          # the gatesentry Makefile maps to the release asset suffix.
          - sdk_tag: x86_64-23.05.6
            board: x86_64
          - sdk_tag: aarch64_cortex-a53-23.05.6
            board: aarch64_cortex-a53
          - sdk_tag: ramips-mt7621-23.05.6
            board: mipsel_24kc
          - sdk_tag: arm_cortex-a7_neon-vfpv4-23.05.6
            board: arm_cortex-a7

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Detect release version
        id: version
        run: |
          TAG=$(awk -F'"' '/var GATESENTRY_VERSION =/ { print $2 }' main.go)
          echo "tag=v${TAG}" >> "$GITHUB_OUTPUT"
          echo "Building ipks for tag v${TAG}"

      - name: Pull OpenWrt SDK container
        run: |
          echo "Pulling openwrt/sdk:${{ matrix.sdk_tag }}"
          docker pull openwrt/sdk:${{ matrix.sdk_tag }}

      - name: Compile ipk packages
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/package":/src/package:ro \
            -v openwrt-sdk-build-${{ matrix.board }}:/sdk \
            openwrt/sdk:${{ matrix.sdk_tag }} \
            sh -c '
              set -e
              set -x
              mkdir -p /sdk
              cp -r /src/package /sdk/package
              cd /sdk

              echo "=== feeds update ==="
              ./scripts/feeds update -a
              echo "=== feeds install ==="
              ./scripts/feeds install -a

              echo "=== compile gatesentry ==="
              make package/gatesentry/compile V=s 2>&1 | tail -80
              echo "=== compile luci-app-gatesentry ==="
              make package/luci-app-gatesentry/compile V=s 2>&1 | tail -80

              echo "=== produced ipks ==="
              find bin/packages -name "*.ipk"
            '

      - name: Stage compiled ipks
        id: ipks
        run: |
          mkdir -p dist
          docker run --rm \
            -v openwrt-sdk-build-${{ matrix.board }}:/sdk:ro \
            -v "${{ github.workspace }}/dist":/dist \
            openwrt/sdk:${{ matrix.sdk_tag }} \
            sh -c '
              mkdir -p /dist
              find /sdk/bin/packages -name "gatesentry_*.ipk" -o -name "luci-app-gatesentry_*.ipk" | while read f; do
                echo "staging $f"
                cp "$f" /dist/
              done
              ls -la /dist/
            '

      - name: Upload ipks as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ipk-${{ matrix.board }}
          path: dist/*.ipk
          if-no-files-found: error
          retention-days: 14

      - name: Attach ipks to GitHub release
        if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if [ ! -d dist ] || [ -z "$(ls -A dist/*.ipk 2>/dev/null)" ]; then
            echo "::error::no ipks produced for ${{ matrix.board }}"
            exit 1
          fi
          gh release upload "$TAG" dist/*.ipk \
            --repo "${{ github.repository }}" \
            --clobber